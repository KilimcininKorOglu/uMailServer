version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - unused
        path: internal/homedir
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
