services:
  umailserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umailserver
    restart: unless-stopped
    ports:
      # Local development HTTP API and Web UI
      - "8088:8080"
      # Local development mail testing ports
      - "2525:2525"
      - "2587:2587"
      - "2143:2143"
      - "4190:4190"
    volumes:
      - ./docker-data:/data
      - ./config:/etc/umailserver:ro
    environment:
      - TZ=UTC
      - UMAILSERVER_SERVER_DATA_DIR=/data
      - UMAILSERVER_SERVER_HOSTNAME=mail.local.test
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: umail-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mailnet
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: umail-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - mailnet
    profiles:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  mailnet:
    driver: bridge
