services:
  umailserver:
    image: umailserver:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umailserver
    restart: unless-stopped
    ports:
      - "8088:8080"
      - "8444:8443"
      - "2525:25"
      - "2587:587"
      - "2143:143"
      - "4190:4190"
      - "8084:8084"
      - "2110:110"
      - "8082:8082"
      - "8083:8083"
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - ./docker-data:/data
      - ./config:/etc/umailserver
    environment:
      - TZ=:/etc/localtime
      - UMAILSERVER_SERVER_DATA_DIR=/data
      - UMAILSERVER_SERVER_HOSTNAME=mail.local.test
      - UMAILSERVER_METRICS_ENABLED=true
      - UMAILSERVER_METRICS_BIND=0.0.0.0
      - UMAILSERVER_METRICS_PORT=8081
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    networks:
      - mailnet
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis coordinates the HA cluster (shared session/blacklist/rate-limit state,
  # leader election, cross-node IDLE/SSE pub/sub). Only used when cluster.enabled
  # is set; harmless otherwise. AOF persistence so a restart does not resurrect
  # revoked tokens (the blacklist must survive).
  redis:
    image: redis:7-alpine
    container_name: umail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - redis_data:/data
    environment:
      - TZ=:/etc/localtime
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: umail-prometheus
    restart: unless-stopped
    depends_on:
      - umailserver
    ports:
      - "9090:9090"
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=:/etc/localtime
    networks:
      - mailnet

  grafana:
    image: grafana/grafana:latest
    container_name: umail-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - TZ=:/etc/localtime
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - mailnet

volumes:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  mailnet:
    driver: bridge
