swagger: '2.0'
info:
  title: uMailServer API
  version: 1.0.0
  description: |
    Legacy Swagger 2.0 compatibility snapshot for the current uMailServer HTTP API.

    Use `api/openapi.yaml` as the authoritative spec.

    Notes:
    - REST routes live under `/api/v1/*`.
    - Browser login uses the `jwt` HttpOnly cookie; non-browser clients may also receive `token`.
    - `must_change_password` may appear in login and refresh responses.
    - In separate admin-listener mode, admin-only routes move off the main listener.
    - `/metrics` is Prometheus text output; `/api/v1/metrics` is authenticated JSON.
host: localhost:8080
basePath: /
schemes:
  - http
  - https
consumes:
  - application/json
produces:
  - application/json
security:
  - BearerAuth: []
tags:
  - name: Authentication
  - name: Health
  - name: Realtime
  - name: Search
  - name: Threads
  - name: Vacation
  - name: Push
  - name: Filters
  - name: Mail
  - name: Backups
  - name: Cluster
  - name: Domains
  - name: Accounts
  - name: Aliases
  - name: Queue
  - name: Admin
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      security: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/LoginRequest'
      responses:
        200:
          description: Login successful
          schema:
            $ref: '#/definitions/LoginResponse'
        400:
          description: Invalid request
          schema:
            $ref: '#/definitions/Problem'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/Problem'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current session
      responses:
        200:
          description: Logout successful
          schema:
            $ref: '#/definitions/GenericObject'
    delete:
      tags: [Authentication]
      summary: Logout current session
      responses:
        200:
          description: Logout successful
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh authenticated session
      responses:
        200:
          description: Refresh successful
          schema:
            $ref: '#/definitions/LoginResponse'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/Problem'
  /health:
    get:
      tags: [Health]
      summary: Full health report
      security: []
      responses:
        200:
          description: Health response
          schema:
            $ref: '#/definitions/GenericObject'
        503:
          description: Unhealthy response
          schema:
            $ref: '#/definitions/GenericObject'
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        200:
          description: Service is alive
          schema:
            $ref: '#/definitions/GenericObject'
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        200:
          description: Service is ready
          schema:
            $ref: '#/definitions/GenericObject'
        503:
          description: Service is not ready
          schema:
            $ref: '#/definitions/GenericObject'
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      produces:
        - text/plain
      responses:
        200:
          description: Prometheus text metrics
          schema:
            type: string
  /api/v1/events:
    get:
      tags: [Realtime]
      summary: Server-Sent Events stream
      produces:
        - text/event-stream
      responses:
        200:
          description: Event stream
          schema:
            type: string
  /api/v1/search:
    get:
      tags: [Search]
      summary: Search messages
      parameters:
        - in: query
          name: q
          type: string
      responses:
        200:
          description: Search results
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/threads:
    get:
      tags: [Threads]
      summary: List thread summaries
      responses:
        200:
          description: Thread summaries
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/threads/search:
    get:
      tags: [Threads]
      summary: Search threads
      responses:
        200:
          description: Thread search results
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/threads/{id}:
    parameters:
      - in: path
        name: id
        required: true
        type: string
    get:
      tags: [Threads]
      summary: Get thread detail
      responses:
        200:
          description: Thread detail
          schema:
            $ref: '#/definitions/GenericObject'
        404:
          description: Not found
          schema:
            $ref: '#/definitions/Problem'
    delete:
      tags: [Threads]
      summary: Delete thread
      responses:
        200:
          description: Thread deleted
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/threads/{id}/read:
    parameters:
      - in: path
        name: id
        required: true
        type: string
    post:
      tags: [Threads]
      summary: Mark thread as read
      responses:
        200:
          description: Thread updated
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/vacation:
    get:
      tags: [Vacation]
      summary: Get vacation configuration
      responses:
        200:
          description: Vacation config
          schema:
            $ref: '#/definitions/VacationConfig'
    put:
      tags: [Vacation]
      summary: Update vacation configuration
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/VacationConfig'
      responses:
        200:
          description: Vacation updated
          schema:
            $ref: '#/definitions/GenericObject'
    delete:
      tags: [Vacation]
      summary: Delete vacation configuration
      responses:
        200:
          description: Vacation removed
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/push/vapid-public-key:
    get:
      tags: [Push]
      summary: Get VAPID public key
      responses:
        200:
          description: VAPID public key
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/push/subscribe:
    post:
      tags: [Push]
      summary: Create push subscription
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        201:
          description: Subscription created
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/push/unsubscribe:
    delete:
      tags: [Push]
      summary: Remove push subscription
      parameters:
        - in: query
          name: id
          type: string
      responses:
        200:
          description: Subscription removed
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/push/subscriptions:
    get:
      tags: [Push]
      summary: List push subscriptions
      responses:
        200:
          description: Subscription list
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/push/test:
    post:
      tags: [Push]
      summary: Send test push notification
      responses:
        200:
          description: Test sent
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/filters:
    get:
      tags: [Filters]
      summary: List filters
      responses:
        200:
          description: Filter list
          schema:
            $ref: '#/definitions/GenericObject'
    post:
      tags: [Filters]
      summary: Create filter
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/FilterMutation'
      responses:
        201:
          description: Filter created
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/filters/reorder:
    post:
      tags: [Filters]
      summary: Reorder filters
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        200:
          description: Filters reordered
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/filters/{id}:
    parameters:
      - in: path
        name: id
        required: true
        type: string
    get:
      tags: [Filters]
      summary: Get filter
      responses:
        200:
          description: Filter detail
          schema:
            $ref: '#/definitions/GenericObject'
    put:
      tags: [Filters]
      summary: Update filter
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/FilterMutation'
      responses:
        200:
          description: Filter updated
          schema:
            $ref: '#/definitions/GenericObject'
    delete:
      tags: [Filters]
      summary: Delete filter
      responses:
        200:
          description: Filter deleted
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/mail/inbox:
    get: &mail_list_get
      tags: [Mail]
      summary: List mail in a fixed folder
      parameters:
        - in: query
          name: folder
          type: string
      responses:
        200:
          description: Mail list
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/mail/sent:
    get: *mail_list_get
  /api/v1/mail/drafts:
    get: *mail_list_get
  /api/v1/mail/trash:
    get: *mail_list_get
  /api/v1/mail/spam:
    get: *mail_list_get
  /api/v1/mail/send:
    post:
      tags: [Mail]
      summary: Send mail
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        200:
          description: Mail sent
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/mail/delete:
    delete:
      tags: [Mail]
      summary: Delete mail
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        200:
          description: Mail deleted
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backups:
    get:
      tags: [Backups]
      summary: List backups
      parameters:
        - in: query
          name: target
          type: string
      responses:
        200:
          description: Backup list
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backups/{id}:
    parameters:
      - in: path
        name: id
        required: true
        type: string
    get:
      tags: [Backups]
      summary: Get backup detail
      responses:
        200:
          description: Backup detail
          schema:
            $ref: '#/definitions/GenericObject'
    delete:
      tags: [Backups]
      summary: Delete backup
      responses:
        200:
          description: Backup removed
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backups/{id}/verify:
    parameters:
      - in: path
        name: id
        required: true
        type: string
    post:
      tags: [Backups]
      summary: Verify backup
      responses:
        200:
          description: Backup verified
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backups/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        type: string
    post:
      tags: [Backups]
      summary: Restore backup
      responses:
        200:
          description: Backup restored
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backups/per-user/{user}:
    parameters:
      - in: path
        name: user
        required: true
        type: string
    post:
      tags: [Backups]
      summary: Run per-user backup
      responses:
        200:
          description: Backup run started
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backups/per-mailbox/{user}/{mailbox}:
    parameters:
      - in: path
        name: user
        required: true
        type: string
      - in: path
        name: mailbox
        required: true
        type: string
    post:
      tags: [Backups]
      summary: Run per-mailbox backup
      responses:
        200:
          description: Backup run started
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backup-jobs:
    get:
      tags: [Backups]
      summary: List backup jobs
      parameters:
        - in: query
          name: enabled
          type: boolean
      responses:
        200:
          description: Backup jobs
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backup-jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        type: string
    get:
      tags: [Backups]
      summary: Get backup job
      responses:
        200:
          description: Backup job
          schema:
            $ref: '#/definitions/GenericObject'
    put:
      tags: [Backups]
      summary: Update backup job
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        200:
          description: Backup job updated
          schema:
            $ref: '#/definitions/GenericObject'
    delete:
      tags: [Backups]
      summary: Delete backup job
      responses:
        200:
          description: Backup job removed
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/backup-jobs/{id}/run:
    parameters:
      - in: path
        name: id
        required: true
        type: string
    post:
      tags: [Backups]
      summary: Run backup job immediately
      responses:
        200:
          description: Backup job started
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/cluster/status:
    get:
      tags: [Cluster]
      summary: Get cluster status
      responses:
        200:
          description: Cluster status
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/cluster/instances:
    get:
      tags: [Cluster]
      summary: List cluster instances
      responses:
        200:
          description: Cluster instances
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/cluster/failover:
    post:
      tags: [Cluster]
      summary: Trigger cluster failover
      responses:
        200:
          description: Failover triggered
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/cluster/heartbeat:
    post:
      tags: [Cluster]
      summary: Submit cluster heartbeat
      responses:
        200:
          description: Heartbeat accepted
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/domains:
    get:
      tags: [Domains]
      summary: List domains
      responses:
        200:
          description: Domain list
          schema:
            type: array
            items:
              $ref: '#/definitions/GenericObject'
    post:
      tags: [Domains]
      summary: Create domain
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        201:
          description: Domain created
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/domains/{name}:
    parameters:
      - in: path
        name: name
        required: true
        type: string
    get:
      tags: [Domains]
      summary: Get domain
      responses:
        200:
          description: Domain detail
          schema:
            $ref: '#/definitions/GenericObject'
    put:
      tags: [Domains]
      summary: Update domain
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        200:
          description: Domain updated
          schema:
            $ref: '#/definitions/GenericObject'
    delete:
      tags: [Domains]
      summary: Delete domain
      responses:
        200:
          description: Domain deleted
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      description: Non-admin callers receive only their own account entry.
      responses:
        200:
          description: Account list
          schema:
            type: array
            items:
              $ref: '#/definitions/GenericObject'
    post:
      tags: [Accounts]
      summary: Create account
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        201:
          description: Account created
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/accounts/{email}:
    parameters:
      - in: path
        name: email
        required: true
        type: string
        description: Full email address, URL-encoded in the path
    get:
      tags: [Accounts]
      summary: Get account
      responses:
        200:
          description: Account detail
          schema:
            $ref: '#/definitions/GenericObject'
    put:
      tags: [Accounts]
      summary: Update account
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/GenericObject'
      responses:
        200:
          description: Account updated
          schema:
            $ref: '#/definitions/GenericObject'
    delete:
      tags: [Accounts]
      summary: Delete account
      responses:
        200:
          description: Account deleted
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/accounts/{email}/totp/setup:
    parameters:
      - in: path
        name: email
        required: true
        type: string
    post:
      tags: [Accounts]
      summary: Begin TOTP setup for an account
      responses:
        200:
          description: TOTP setup initialized
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/accounts/{email}/totp/verify:
    parameters:
      - in: path
        name: email
        required: true
        type: string
    post:
      tags: [Accounts]
      summary: Verify and enable TOTP for an account
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
      responses:
        200:
          description: TOTP enabled
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/accounts/{email}/totp/disable:
    parameters:
      - in: path
        name: email
        required: true
        type: string
    post:
      tags: [Accounts]
      summary: Disable TOTP for an account
      responses:
        200:
          description: TOTP disabled
          schema:
            $ref: '#/definitions/GenericObject'
  /api/v1/aliases:
