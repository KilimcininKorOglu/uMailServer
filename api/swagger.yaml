            $ref: '#/definitions/GenericObject'
securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
definitions:
  GenericObject:
    type: object
    additionalProperties: true
  Problem:
    type: object
    properties:
      error:
        type: string
      message:
        type: string
      code:
        type: integer
    additionalProperties: true
  LoginRequest:
    type: object
    required: [email, password]
    properties:
      email:
        type: string
        format: email
      password:
        type: string
      totp_code:
        type: string
  LoginResponse:
    type: object
    properties:
      token:
        type: string
      expiresIn:
        type: integer
      must_change_password:
        type: boolean
    additionalProperties: true
  VacationConfig:
    type: object
    properties:
      enabled:
        type: boolean
      start_date:
        type: string
        format: date-time
      end_date:
        type: string
        format: date-time
      subject:
        type: string
      message:
        type: string
      html_message:
        type: string
      send_interval:
        type: integer
      exclude_addresses:
        type: array
        items:
          type: string
      ignore_lists:
        type: boolean
      ignore_bulk:
        type: boolean
  FilterMutation:
    type: object
    properties:
      name:
        type: string
      matchAll:
        type: boolean
      conditions:
        type: array
        items:
          $ref: '#/definitions/GenericObject'
      actions:
        type: array
        items:
          $ref: '#/definitions/GenericObject'
    additionalProperties: true
  RateLimitConfig:
    type: object
    properties:
      ip_per_minute:
        type: integer
      ip_per_hour:
        type: integer
      ip_per_day:
        type: integer
      ip_connections:
        type: integer
      user_per_minute:
        type: integer
      user_per_hour:
        type: integer
      user_per_day:
        type: integer
      user_max_recipients:
        type: integer
      global_per_minute:
        type: integer
      global_per_hour:
        type: integer
