openapi: 3.0.3
info:
  title: uMailServer API
  version: 1.0.0
  description: |
    Current HTTP API surface for uMailServer.

    Key behavior notes:

    - The REST API lives under `/api/v1/*`.
    - Browser logins receive the JWT via the `jwt` HttpOnly cookie.
    - Non-browser API clients also receive a `token` field in the login response.
    - Login and refresh responses may include `must_change_password`.
    - When separate admin-listener mode is enabled, admin-only routes disappear from the main listener and are served only from the dedicated admin listener.
    - `/metrics` returns Prometheus text output, while `/api/v1/metrics` returns authenticated JSON metrics.
servers:
  - url: http://localhost:8080
    description: Direct local server
  - url: http://localhost:8443
    description: Example dedicated admin listener
  - url: https://mail.example.com
    description: Example production listener
security:
  - BearerAuth: []
tags:
  - name: Authentication
  - name: Health
  - name: Realtime
  - name: Search
  - name: Threads
  - name: Vacation
  - name: Push
  - name: Filters
  - name: Mail
  - name: Backups
  - name: Cluster
  - name: Domains
  - name: Accounts
  - name: Aliases
  - name: Queue
  - name: Admin
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current session
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Authentication]
      summary: Logout current session
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh authenticated session
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /health:
    get:
      tags: [Health]
      summary: Full health report
      security: []
      responses:
        '200':
          description: Health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Unhealthy response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: Admin-auth protected text metrics endpoint
      responses:
        '200':
          description: Prometheus text metrics
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/events:
    get:
      tags: [Realtime]
      summary: Server-Sent Events stream
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/search:
    get:
      tags: [Search]
      summary: Search messages
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search query
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/threads:
    get:
      tags: [Threads]
      summary: List thread summaries
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/threads/search:
    get:
      tags: [Threads]
      summary: Search threads
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/threads/{id}:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [Threads]
      summary: Get thread detail
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Threads]
      summary: Delete thread
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/threads/{id}/read:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    post:
      tags: [Threads]
      summary: Mark thread as read
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/vacation:
    get:
      tags: [Vacation]
      summary: Get vacation configuration
      responses:
        '200':
          description: Vacation config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationConfig'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Vacation]
      summary: Update vacation configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacationConfig'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Vacation]
      summary: Delete vacation configuration
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/push/vapid-public-key:
    get:
      tags: [Push]
      summary: Get VAPID public key
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/push/subscribe:
    post:
      tags: [Push]
      summary: Create push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, p256dh, auth]
              properties:
                endpoint:
                  type: string
                  format: uri
                p256dh:
                  type: string
                auth:
                  type: string
                deviceType:
                  type: string
                os:
                  type: string
                browser:
                  type: string
                name:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/GenericObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/push/unsubscribe:
    delete:
      tags: [Push]
      summary: Remove push subscription
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: Subscription ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/push/subscriptions:
    get:
      tags: [Push]
      summary: List push subscriptions
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/push/test:
    post:
      tags: [Push]
      summary: Send test push notification
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/filters:
    get:
      tags: [Filters]
      summary: List filters
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Filters]
      summary: Create filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterMutation'
      responses:
        '201':
          $ref: '#/components/responses/GenericObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/filters/reorder:
    post:
      tags: [Filters]
      summary: Reorder filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/filters/{id}:
    parameters:
      - $ref: '#/components/parameters/FilterId'
    get:
      tags: [Filters]
      summary: Get filter
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Filters]
      summary: Update filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterMutation'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Filters]
      summary: Delete filter
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/mail/inbox:
    get: &mail_list_get
      tags: [Mail]
      summary: List mail in a fixed folder
      parameters:
        - in: query
          name: folder
          schema:
            type: string
          description: Optional folder override used by the handler
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/mail/sent:
    get: *mail_list_get
  /api/v1/mail/drafts:
    get: *mail_list_get
  /api/v1/mail/trash:
    get: *mail_list_get
  /api/v1/mail/spam:
    get: *mail_list_get
  /api/v1/mail/send:
    post:
      tags: [Mail]
      summary: Send mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/mail/delete:
    delete:
      tags: [Mail]
      summary: Delete mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/backups:
    get:
      tags: [Backups]
      summary: List backups
      parameters:
        - in: query
          name: target
          schema:
            type: string
          description: Optional target filter
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/backups/{id}:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    get:
      tags: [Backups]
      summary: Get backup detail
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Backups]
      summary: Delete backup
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/backups/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    post:
      tags: [Backups]
      summary: Verify backup
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/backups/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    post:
      tags: [Backups]
      summary: Restore backup
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/backups/per-user/{user}:
    parameters:
      - in: path
        name: user
        required: true
        schema:
          type: string
    post:
      tags: [Backups]
      summary: Run per-user backup
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/backups/per-mailbox/{user}/{mailbox}:
    parameters:
      - in: path
        name: user
        required: true
        schema:
          type: string
      - in: path
        name: mailbox
        required: true
        schema:
          type: string
    post:
      tags: [Backups]
      summary: Run per-mailbox backup
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/backup-jobs:
    get:
      tags: [Backups]
      summary: List backup jobs
      parameters:
        - in: query
          name: enabled
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
  /api/v1/backup-jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Backups]
      summary: Get backup job
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Backups]
      summary: Update backup job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Backups]
      summary: Delete backup job
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/backup-jobs/{id}/run:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    post:
      tags: [Backups]
      summary: Run backup job immediately
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/cluster/status:
    get:
      tags: [Cluster]
      summary: Get cluster status
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/cluster/instances:
    get:
      tags: [Cluster]
      summary: List cluster instances
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/cluster/failover:
    post:
      tags: [Cluster]
      summary: Trigger cluster failover
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/cluster/heartbeat:
    post:
      tags: [Cluster]
      summary: Submit cluster heartbeat
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
  /api/v1/domains:
    get:
      tags: [Domains]
      summary: List domains
      responses:
        '200':
          description: Domain list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Domains]
      summary: Create domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '201':
          $ref: '#/components/responses/GenericObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/domains/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    get:
      tags: [Domains]
      summary: Get domain
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Domains]
      summary: Update domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Domains]
      summary: Delete domain
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      description: Non-admin callers receive only their own account entry.
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Accounts]
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '201':
          $ref: '#/components/responses/GenericObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/accounts/{email}:
    parameters:
      - $ref: '#/components/parameters/AccountEmail'
    get:
      tags: [Accounts]
      summary: Get account
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Accounts]
      summary: Update account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Accounts]
      summary: Delete account
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/accounts/{email}/totp/setup:
    parameters:
      - $ref: '#/components/parameters/AccountEmail'
    post:
      tags: [Accounts]
      summary: Begin TOTP setup for an account
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/accounts/{email}/totp/verify:
    parameters:
      - $ref: '#/components/parameters/AccountEmail'
    post:
      tags: [Accounts]
      summary: Verify and enable TOTP for an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/accounts/{email}/totp/disable:
    parameters:
      - $ref: '#/components/parameters/AccountEmail'
    post:
      tags: [Accounts]
      summary: Disable TOTP for an account
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/aliases:
    get:
      tags: [Aliases]
      summary: List aliases
      responses:
        '200':
          description: Alias list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenericObject'
    post:
      tags: [Aliases]
      summary: Create alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '201':
          $ref: '#/components/responses/GenericObjectResponse'
  /api/v1/aliases/{alias}:
    parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
    get:
      tags: [Aliases]
      summary: Get alias
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Aliases]
      summary: Update alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Aliases]
      summary: Delete alias
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/queue:
    get:
      tags: [Queue]
