              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenericObject'
  /api/v1/admin/queue/{id}:
    parameters:
      - $ref: '#/components/parameters/QueueId'
    get:
      tags: [Admin]
      summary: Alias of queue detail
      responses:
        '200':
          $ref: '#/components/responses/GenericObjectResponse'
    post:
      tags: [Admin]
      summary: Alias of queue retry
      responses:
        '200':
