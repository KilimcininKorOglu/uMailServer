components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ThreadId:
      in: path
      name: id
      required: true
      schema:
        type: string
    FilterId:
      in: path
      name: id
      required: true
      schema:
        type: string
    BackupId:
      in: path
      name: id
      required: true
      schema:
        type: string
    QueueId:
      in: path
      name: id
      required: true
      schema:
        type: string
    AccountEmail:
      in: path
      name: email
      required: true
      schema:
        type: string
      description: Full email address, URL-encoded in the path
  responses:
    Problem:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Message:
      description: Simple status/message response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    GenericObjectResponse:
      description: Generic JSON object response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
  schemas:
    Problem:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
      additionalProperties: true
    MessageResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      additionalProperties: true
    GenericObject:
      type: object
      additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        totp_code:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Present for non-browser API clients
        expiresIn:
          type: integer
        must_change_password:
          type: boolean
      additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      additionalProperties: true
    VacationConfig:
      type: object
      properties:
        enabled:
          type: boolean
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        subject:
          type: string
        message:
          type: string
        html_message:
          type: string
        send_interval:
          type: integer
        exclude_addresses:
          type: array
          items:
            type: string
        ignore_lists:
          type: boolean
        ignore_bulk:
          type: boolean
    FilterMutation:
      type: object
      properties:
        name:
          type: string
        matchAll:
          type: boolean
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/GenericObject'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/GenericObject'
      additionalProperties: true
    RateLimitConfig:
      type: object
      properties:
        ip_per_minute:
          type: integer
        ip_per_hour:
          type: integer
        ip_per_day:
          type: integer
        ip_connections:
          type: integer
        user_per_minute:
          type: integer
        user_per_hour:
          type: integer
        user_per_day:
          type: integer
        user_max_recipients:
          type: integer
        global_per_minute:
          type: integer
        global_per_hour:
          type: integer
