# Full HA stack for ha-report.md Faz 5 — adds DATA-TIER redundancy on top of the
# active-active app tier in docker-compose.ha.yml:
#
#   * PostgreSQL: a two-node repmgr cluster (pg-1/pg-2) with AUTOMATIC failover —
#     repmgr promotes the surviving node when the primary dies — fronted by pgpool
#     as the single connection endpoint that follows the current primary. Load
#     balancing is disabled, so pgpool is a failover-aware write proxy (the boot
#     advisory lock and all writes always reach the primary). The app's DSN points
#     at pgpool, so a primary failure is transparent to it.
#   * Redis: master + replica + a 3-node Sentinel quorum. The app connects with a
#     redis-sentinel:// URL (newRedisClient -> go-redis FailoverClient), so it
#     follows a master failover automatically.
#
# Two stateless uMailServer nodes behind HAProxy round-robin, sharing the data
# tier + Maildir, complete the picture. Run:
#   docker compose -f docker-compose.ha-full.yml up -d
# (stop the dev stack and docker-compose.ha.yml first — same host ports.)

services:
  # --- PostgreSQL: two-node repmgr cluster with AUTOMATIC failover ---
  # postgresql-repmgr runs repmgr alongside Postgres: the two nodes elect a
  # primary and, when it dies, repmgr promotes the surviving standby with no
  # operator action. pgpool (below) is the single connection endpoint that tracks
  # which node is currently primary and routes there, so the app sees one stable
  # address across a failover.
  pg-1:
    image: bitnamilegacy/postgresql-repmgr:16
    container_name: umail-haf-pg-1
    restart: unless-stopped
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres-admin-change-me
      - POSTGRESQL_USERNAME=umailserver
      - POSTGRESQL_PASSWORD=change-me-in-deployment
      - POSTGRESQL_DATABASE=umailserver
      - REPMGR_PASSWORD=repmgr-change-me
      - REPMGR_PRIMARY_HOST=pg-1
      - REPMGR_PRIMARY_PORT=5432
      - REPMGR_PARTNER_NODES=pg-1,pg-2
      - REPMGR_NODE_NAME=pg-1
      - REPMGR_NODE_NETWORK_NAME=pg-1
      - REPMGR_PORT_NUMBER=5432
    volumes:
      - ./docker-data-haf/pg-1:/bitnami/postgresql
    networks:
      - hafnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umailserver -d umailserver"]
      interval: 10s
      timeout: 5s
      retries: 20

  pg-2:
    image: bitnamilegacy/postgresql-repmgr:16
    container_name: umail-haf-pg-2
    restart: unless-stopped
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres-admin-change-me
      - POSTGRESQL_USERNAME=umailserver
      - POSTGRESQL_PASSWORD=change-me-in-deployment
      - POSTGRESQL_DATABASE=umailserver
      - REPMGR_PASSWORD=repmgr-change-me
      - REPMGR_PRIMARY_HOST=pg-1
      - REPMGR_PRIMARY_PORT=5432
      - REPMGR_PARTNER_NODES=pg-1,pg-2
      - REPMGR_NODE_NAME=pg-2
      - REPMGR_NODE_NETWORK_NAME=pg-2
      - REPMGR_PORT_NUMBER=5432
    volumes:
      - ./docker-data-haf/pg-2:/bitnami/postgresql
    networks:
      - hafnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umailserver -d umailserver"]
      interval: 10s
      timeout: 5s
      retries: 20

  # pgpool is the single Postgres endpoint the app talks to. It health-checks both
  # repmgr nodes and forwards to the current primary; on a failover it follows the
  # newly promoted node. Load balancing is OFF so every statement (including the
  # boot pg_advisory_lock and all writes) goes to the primary — pgpool acts purely
  # as a failover-aware write proxy, not a read splitter.
  pgpool:
    image: bitnamilegacy/pgpool:4
    container_name: umail-haf-pgpool
    restart: unless-stopped
    depends_on:
      pg-1:
        condition: service_healthy
      pg-2:
        condition: service_healthy
    environment:
      - PGPOOL_BACKEND_NODES=0:pg-1:5432,1:pg-2:5432
      - PGPOOL_SR_CHECK_USER=umailserver
      - PGPOOL_SR_CHECK_PASSWORD=change-me-in-deployment
      - PGPOOL_HEALTH_CHECK_USER=umailserver
      - PGPOOL_HEALTH_CHECK_PASSWORD=change-me-in-deployment
      - PGPOOL_POSTGRES_USERNAME=postgres
      - PGPOOL_POSTGRES_PASSWORD=postgres-admin-change-me
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD=pgpool-admin-change-me
      - PGPOOL_POSTGRES_CUSTOM_USERS=umailserver
      - PGPOOL_POSTGRES_CUSTOM_PASSWORDS=change-me-in-deployment
      - PGPOOL_ENABLE_LOAD_BALANCING=no
      - PGPOOL_ENABLE_LDAP=no
    networks:
      - hafnet
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

  # --- Redis: master + replica + 3 Sentinels (official redis:7-alpine) ---
  redis-master:
    image: redis:7-alpine
    container_name: umail-haf-redis-master
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./docker-data-haf/redis-master:/data
    networks:
      - hafnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    container_name: umail-haf-redis-replica
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    networks:
      - hafnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Each Sentinel writes its config at start (a sentinel conf file must be
  # writable — Sentinel rewrites it on failover) then runs redis-sentinel.
  # resolve-hostnames lets us monitor the master by its compose service name.
  redis-sentinel-1: &sentinel
    image: redis:7-alpine
    container_name: umail-haf-sentinel-1
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_started
    command:
      - sh
      - -c
      - |
        cat > /tmp/sentinel.conf <<'EOF'
        port 26379
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-master 6379 2
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    networks:
      - hafnet
  redis-sentinel-2:
    <<: *sentinel
    container_name: umail-haf-sentinel-2
  redis-sentinel-3:
    <<: *sentinel
    container_name: umail-haf-sentinel-3

  # --- Stateless app tier (active-active) ---
  node1: &appnode
    image: umailserver:latest
    container_name: umail-haf-node1
    hostname: umail-haf-node1
    restart: unless-stopped
    command: ["serve", "--config", "/etc/umailserver/umailserver.ha-full.yaml"]
    volumes:
      - ./docker-data-haf/maildata:/data
      - ./config:/etc/umailserver:ro
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    networks:
      - hafnet
    depends_on:
      pgpool:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  node2:
    <<: *appnode
    container_name: umail-haf-node2
    hostname: umail-haf-node2

  haproxy:
    image: haproxy:2.9-alpine
    container_name: umail-haf-haproxy
    restart: unless-stopped
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8088:8080"
      - "8444:8443"
      - "2525:25"
      - "2587:587"
      - "2143:143"
      - "2110:110"
      - "4190:4190"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
    networks:
      - hafnet
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy

networks:
  hafnet:
    driver: bridge
