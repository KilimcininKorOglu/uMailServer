name: umailserver

services:
  umailserver:
    image: umailserver:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umailserver
    restart: unless-stopped
    ports:
      - "8088:8080"
      - "8444:8443"
      - "2525:25"
      - "2587:587"
      - "2424:24"
      - "2143:143"
      - "4190:4190"
      - "8084:8084"
      - "2110:110"
      - "8082:8082"
      - "8083:8083"
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - ./docker-data:/data
      - ./config:/etc/umailserver
    environment:
      - TZ=:/etc/localtime
      - UMAILSERVER_SERVER_DATA_DIR=/data
      - UMAILSERVER_SERVER_HOSTNAME=mail.local.test
      - UMAILSERVER_METRICS_ENABLED=true
      - UMAILSERVER_METRICS_BIND=0.0.0.0
      - UMAILSERVER_METRICS_PORT=8081
      # Local end-to-end TLS via the bundled Pebble ACME test server. The public
      # ports (8088/8444 and the mail listeners) serve the ACME-issued cert; the
      # plain HTTP listener moves to 5002 for the ACME HTTP-01 challenge and the
      # container healthcheck.
      - UMAILSERVER_TLS_ACME_ENABLED=true
      - UMAILSERVER_TLS_ACME_DIRECTORYURL=https://pebble:14000/dir
      - UMAILSERVER_TLS_ACME_CACERTFILE=/etc/umailserver/pebble/pebble.minica.pem
      # Ephemeral in-container cert cache (deliberately NOT /data): Pebble
      # regenerates its issuing CA on every restart, so a persisted cert would be
      # orphaned -- it would chain to a dead CA after the next
      # `make docker-stop && make docker-run` and fail validation. A fresh
      # container re-issues against the current CA in ~2s and is always valid.
      # Persistence stays available in config (correct for prod, stable CA).
      - UMAILSERVER_TLS_ACME_CACHEDIR=/home/umailserver/certs
      - UMAILSERVER_HTTP_HTTPPORT=5002
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    networks:
      mailnet:
        aliases:
          # Pebble validates and issues for this name; the cert SAN matches it.
          - mail.local.test
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      pebble:
        condition: service_started
    healthcheck:
      # The public ports now serve TLS, so probe the plain HTTP challenge listener.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis coordinates the HA cluster (shared session/blacklist/rate-limit state,
  # leader election, cross-node IDLE/SSE pub/sub). Only used when cluster.enabled
  # is set; harmless otherwise. AOF persistence so a restart does not resurrect
  # revoked tokens (the blacklist must survive).
  redis:
    image: redis:7-alpine
    container_name: umail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - redis_data:/data
    environment:
      - TZ=:/etc/localtime
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL is the relational account/metadata backend selected with
  # database.backend: postgres (and database.dsn pointing at this service). The
  # default dev config uses bbolt, so this runs idle until an operator switches
  # the backend; umailserver waits for it to be healthy before booting.
  postgres:
    image: postgres:16-alpine
    container_name: umail-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umailserver
      - POSTGRES_USER=umailserver
      - POSTGRES_PASSWORD=change-me-in-deployment
      - TZ=:/etc/localtime
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mailnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umailserver"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: umail-prometheus
    restart: unless-stopped
    depends_on:
      - umailserver
    ports:
      # Host 9090 is registered to another local stack (see ~/.claude/docker-ports.md);
      # expose Prometheus on 9092 to avoid a first-come-first-served collision.
      - "9092:9090"
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=:/etc/localtime
    networks:
      - mailnet

  grafana:
    image: grafana/grafana:latest
    container_name: umail-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - /usr/share/zoneinfo/Europe/Istanbul:/etc/localtime:ro
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - TZ=:/etc/localtime
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - mailnet

  # Pebble is Let's Encrypt's miniature ACME test server; it gives the local
  # stack real certificate issuance so SSL is exercised exactly as in production.
  # Pinned by digest so its built-in directory-endpoint CA (pebble.minica.pem,
  # extracted via `make pebble-ca`, trusted by umailserver) cannot drift.
  # PEBBLE_VA_NOSLEEP removes the artificial validation delay; -dnsserver points
  # Pebble at Docker's embedded DNS so it resolves mail.local.test back to the
  # umailserver container for HTTP-01 validation.
  pebble:
    image: ghcr.io/letsencrypt/pebble@sha256:b1af638b2006a83dbf01de838f03eef37574929aef0b7dc0fac116403db550ea
    container_name: umail-pebble
    restart: unless-stopped
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "127.0.0.11:53"]
    environment:
      - PEBBLE_VA_NOSLEEP=1
    volumes:
      # Synchronous issuance config (retryAfter 0) so autocert's finalize gets the
      # certificate URL immediately instead of an async "processing" response.
      - ./config/pebble/pebble-config.json:/test/config/pebble-config.json:ro
    ports:
      - "14000:14000"
      - "15000:15000"
    networks:
      - mailnet

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
  postgres_data:

networks:
  mailnet:
    driver: bridge
