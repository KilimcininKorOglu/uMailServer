# HAProxy round-robin front for the multi-node (active-active) uMailServer
# deployment described in ha-report.md Faz 5. It load-balances every client
# protocol across the stateless uMailServer nodes; the nodes share one
# PostgreSQL (metadata) + Redis (coordination/pub-sub) + Maildir filesystem, so
# any connection can land on any node. In production Keepalived owns a VRRP VIP
# in front of this HAProxy for front-end failover; in the dev stack HAProxy is
# reached directly on the published host ports.
global
    log stdout format raw local0 info
    maxconn 8192

defaults
    mode    tcp
    balance roundrobin
    # When a connection to the chosen node fails (e.g. it was just killed and
    # not yet health-checked down), retry and redispatch it to the other node
    # instead of failing the client. This closes the failover gap between a node
    # dying and HAProxy marking it down: a client briefly waits out the short
    # connect timeout, then lands on the surviving node rather than erroring.
    retries 3
    option  redispatch
    timeout connect 2s
    timeout client  1h
    timeout server  1h
    log     global
    option  tcplog
    # Tighter health checks shrink the down-detection window (~4s instead of
    # ~15s); shutdown-sessions drops live connections to a node the moment it is
    # marked down so long-lived IMAP/IDLE clients reconnect to a healthy node.
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions

# --- HTTP / webmail / user API (health-checked via GET /health) ---
frontend fe_http
    bind *:8080
    mode http
    option httplog
    default_backend be_http
backend be_http
    mode http
    option httpchk GET /health
    server node1 node1:8080 check
    server node2 node2:8080 check

# --- Admin listener (plain HTTP in dev) ---
frontend fe_admin
    bind *:8443
    default_backend be_admin
backend be_admin
    option httpchk GET /health
    server node1 node1:8443 check port 8080
    server node2 node2:8443 check port 8080

# --- SMTP inbound (25) ---
frontend fe_smtp
    bind *:25
    default_backend be_smtp
backend be_smtp
    server node1 node1:25 check
    server node2 node2:25 check

# --- SMTP submission (587) ---
frontend fe_submission
    bind *:587
    default_backend be_submission
backend be_submission
    server node1 node1:587 check
    server node2 node2:587 check

# --- IMAP (143) ---
frontend fe_imap
    bind *:143
    default_backend be_imap
backend be_imap
    server node1 node1:143 check
    server node2 node2:143 check

# --- POP3 (110) ---
frontend fe_pop3
    bind *:110
    default_backend be_pop3
backend be_pop3
    server node1 node1:110 check
    server node2 node2:110 check

# --- ManageSieve (4190) ---
frontend fe_sieve
    bind *:4190
    default_backend be_sieve
backend be_sieve
    server node1 node1:4190 check
    server node2 node2:4190 check

# --- CalDAV (8082) ---
frontend fe_caldav
    bind *:8082
    default_backend be_caldav
backend be_caldav
    server node1 node1:8082 check
    server node2 node2:8082 check

# --- CardDAV (8083) ---
frontend fe_carddav
