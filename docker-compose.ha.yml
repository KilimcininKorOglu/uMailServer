# Multi-node active-active stack for ha-report.md Faz 5: two STATELESS
# uMailServer nodes behind an HAProxy round-robin front, all sharing one
# PostgreSQL (metadata/index/semcore), one Redis (coordination + IDLE/SSE
# pub-sub), and one Maildir filesystem. Because database.backend is postgres NO
# bbolt is opened, so the nodes share /data safely (only Maildir message bodies
# and Sieve scripts live there, and Maildir filenames carry os.Hostname() — the
# two nodes get distinct container hostnames, so names never collide). In
# production the shared FS is GlusterFS replica-3, Postgres is Patroni-managed,
# and Keepalived owns a VRRP VIP in front of HAProxy; here those collapse to one
# shared volume + one Postgres for a single-host functional active-active test.
#
# Run:  docker compose -f docker-compose.ha.yml up -d
# (stop the default dev stack first — both publish the same host ports.)

services:
  postgres:
    image: postgres:16-alpine
    container_name: umail-ha-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umailserver
      - POSTGRES_USER=umailserver
      - POSTGRES_PASSWORD=change-me-in-deployment
    volumes:
      - ./docker-data-ha/postgres:/var/lib/postgresql/data
    networks:
      - hanet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umailserver"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: umail-ha-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./docker-data-ha/redis:/data
    networks:
      - hanet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  node1:
    image: umailserver:latest
    container_name: umail-ha-node1
    hostname: umail-node1
    restart: unless-stopped
    command: ["serve", "--config", "/etc/umailserver/umailserver.ha.yaml"]
    volumes:
      - ./docker-data-ha/maildata:/data
      - ./config:/etc/umailserver:ro
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    networks:
      - hanet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node2:
    image: umailserver:latest
    container_name: umail-ha-node2
    hostname: umail-node2
    restart: unless-stopped
    command: ["serve", "--config", "/etc/umailserver/umailserver.ha.yaml"]
    volumes:
      - ./docker-data-ha/maildata:/data
      - ./config:/etc/umailserver:ro
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    networks:
      - hanet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Serialize first boot: node1 applies the schema + bootstrap admin/domain
      # once, then node2 just connects (avoids a concurrent CREATE TABLE / bootstrap
      # race on a fresh database). Steady-state both are independent active nodes.
      node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  haproxy:
    image: haproxy:2.9-alpine
    container_name: umail-ha-haproxy
    restart: unless-stopped
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8088:8080"
      - "8444:8443"
      - "2525:25"
      - "2587:587"
      - "2143:143"
      - "2110:110"
      - "4190:4190"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
    networks:
      - hanet
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy

networks:
  hanet:
    driver: bridge
